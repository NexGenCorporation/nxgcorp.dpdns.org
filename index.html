<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexGen Corporation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #050811 0%, #0d1326 100%);
            color: #f0f3f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            overflow-hidden: auto;
            position: relative;
        }

        /* Tečne staklene kugle u pozadini - daju dubinu, a ne koče starije procesore */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 102, 255, 0.2) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            filter: blur(20px);
        }
        body::before { top: 10%; left: 10%; }
        body::after { bottom: 10%; right: 10%; }

        /* Glavna Liquid Glass Kartica */
        .glass-card {
            background: rgba(13, 20, 38, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 2px rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        /* Efekat tečnog sjaja na vrhu kartice */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(rgba(255,255,255,0.04), rgba(255,255,255,0));
            border-radius: 20px 20px 0 0;
            pointer-events: none;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(120deg, #ffffff 30%, #58a6ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .tagline {
            color: #8b949e;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        /* Sekcija sa linkovima */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        .glass-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.2rem;
            color: #f0f3f8;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        /* Kul CSS efekat prelamanja svetlosti na hover */
        .glass-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 30%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.1), rgba(255,255,255,0));
            transform: skewX(-25deg);
            transition: 0.75s;
        }

        .glass-btn:hover::after {
            left: 150%;
        }

        .glass-btn:hover {
            background: rgba(88, 166, 255, 0.1);
            border-color: rgba(88, 166, 255, 0.3);
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.15);
            transform: translateY(-2px);
        }

        .btn-icon {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        /* Podnožje */
        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #555d66;
        }

        @media (max-width: 480px) {
            .glass-card { padding: 1.8rem 1.2rem; }
            .logo { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="logo">NexGen</div>
        <div class="tagline">The Digital Ecosystem</div>

        <div class="links-container">
            
            <!-- Poveznica za tvoj file hosting subdomen -->
            <a href="https://iz.rs" class="glass-btn">
                <span>📁 NexFiles Storage</span>
                <span class="btn-icon">→</span>
            </a>

            <!-- Kontakt Email dugme -->
            <a href="mailto:nxgcorpcontact@gmail.com" class="glass-btn">
                <span>✉️ Contact Support</span>
                <span class="btn-icon">→</span>
            </a>
            
        </div>

        <div class="footer">
            &copy; 2026 NexGen Corp. Powered by Liquid Glass.
        </div>
    </div>

</body>
</html>
